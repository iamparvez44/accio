<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To DO App</title>
    <style>
      .app-box {
        min-height: 200px;
        max-width: 300px;
        margin: 80px auto;
        padding: 20px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      input {
        width: 70%;
        height: 25px;
      }
      button {
        height: 30px;
      }

      .task {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 85%;
        padding: 8px 10px;
        margin-top: 10px;
        background-color: #f1f3f5;
        border-radius: 8px;
        font-size: 14px;
      }

      .task p {
        margin: 0;
        flex: 1;
      }

      .task button {
        background-color: #ff4d4d;
        border: none;
        color: white;
        padding: 4px 8px;
        border-radius: 5px;
        cursor: pointer;
      }

      .task button:hover {
        background-color: #e60000;
      }

      body {
        background-color: rgb(224, 231, 236);
      }
    </style>
  </head>
  <body>
    <div class="app-box">
      <h2>To do App</h2>
      <input type="text" id="inp" placeholder="Enter Your Task" />
      <button id="btn">Add</button>
    </div>

    <script>
      let inp = document.querySelector("#inp");
      let btn = document.querySelector("#btn");
      let mainDiv = document.querySelector(".app-box");
      btn.addEventListener("click", () => {
        let innerDiv = document.createElement("innerDiv");
        innerDiv.classList = "task";

        let p = document.createElement("p");
        p.innerText = inp.value;

        let removeBtn = document.createElement("button");
        removeBtn.innerText = "X";

        removeBtn.addEventListener("click", () => {
          innerDiv.remove();
        });

        innerDiv.append(p, removeBtn);
        mainDiv.append(innerDiv);

        inp.value = "";
      });
    </script>
  </body>
</html>
